name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (typecheck + smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "file:./ci.db"
      NODE_ENV: test
      SESSION_TOKEN_SECRET: ci-only-secret-not-for-production-use-0000000000
      PUSH_DELIVERY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client and apply migrations
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Type-check
        run: npx tsc --noEmit

      - name: Seed the database
        run: npm run seed

      - name: Start the API server
        run: npm run dev &
        # tsx watch keeps running; give it a moment to come up before the smoke test hits it.
      - name: Wait for the server to be ready
        run: npx wait-on http://localhost:4000/api/health --timeout 30000

      - name: Run the smoke test suite
        run: npm run smoke

  mobile:
    name: Mobile (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit
